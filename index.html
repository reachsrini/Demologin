<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure login page for accessing your account">
    <meta name="theme-color" content="#3b82f6">
    <title>Login - Secure Access</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="login-wrapper">
            <!-- Header Section -->
            <div class="login-header">
                <div class="logo">
                    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="48" height="48" rx="8" fill="#3b82f6"/>
                        <path d="M24 16C27.314 16 30 18.686 30 22C30 25.314 27.314 28 24 28C20.686 28 18 25.314 18 22C18 18.686 20.686 16 24 16Z" fill="white"/>
                        <path d="M16 34C16 30.134 19.582 27 24 27C28.418 27 32 30.134 32 34V36H16V34Z" fill="white"/>
                    </svg>
                </div>
                <h1>Welcome Back</h1>
                <p class="subtitle">Sign in to your account to continue</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                <!-- Email/Username Field -->
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="you@example.com"
                            required
                            autocomplete="email">
                        <span class="input-icon">📧</span>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            👁️
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader"></span>
                </button>

                <!-- Success Message -->
                <div class="success-message" id="successMessage">
                    ✓ Login successful! Redirecting...
                </div>
            </form>

            <!-- Sign Up Link -->
            <div class="login-footer">
                <p>Don't have an account? <a href="#" class="signup-link">Sign up here</a></p>
            </div>
        </div>

        <!-- Decorative Background -->
        <div class="background-decoration">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
